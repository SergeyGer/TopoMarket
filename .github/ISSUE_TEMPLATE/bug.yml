name: Bug report
description: Something behaves incorrectly
title: "bug: "
labels: ["type: bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and reproduction
      description: Do not paste secrets or private data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, profile, commit.
