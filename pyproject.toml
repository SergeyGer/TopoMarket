[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topomarket"
version = "1.3.1"
description = "Topology-aware market research toolkit with demo and private data profiles."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TopoMarket contributors" }]
keywords = ["market", "topology", "research", "demo"]
classifiers = [
    "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.24",
  "ripser>=0.6,<0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "build>=1.0",
    "twine>=5.0",
]
ui = [
    "streamlit>=1.30,<2",
    "matplotlib>=3.8,<4",
    "plotly>=6.5,<7",
]

[project.urls]
Homepage = "https://github.com/SergeyGer/TopoMarket"
Repository = "https://github.com/SergeyGer/TopoMarket"
Issues = "https://github.com/SergeyGer/TopoMarket/issues"
Wiki = "https://github.com/SergeyGer/TopoMarket/wiki"

[project.scripts]
topomarket = "topomarket.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
topomarket = ["data/*.json", "topology/*.json", "config/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
